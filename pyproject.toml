[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.3.0"
description = "Lightweight Agent execution tracing, debugging, and eval for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "czmir" }]
keywords = ["llm", "agent", "tracing", "observability", "eval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "pydantic>=2.6,<3",
  "opentelemetry-api>=1.24,<2",
  "opentelemetry-sdk>=1.24,<2",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sse-starlette>=2.0,<3",
]
adapters = [
  "langchain-core>=0.3,<1",
  "openai>=1.40,<2",
]
integrations = [
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "langgraph>=0.2.28,<1",
  "openai>=1.40,<2",
]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.4,<1",
  "playwright>=1.45,<2",
]

[project.urls]
Homepage = "https://github.com/czmir/AgentTrace"
Documentation = "https://github.com/czmir/AgentTrace#readme"
Repository = "https://github.com/czmir/AgentTrace"
Issues = "https://github.com/czmir/AgentTrace/issues"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: optional real vendor SDKs / LLM keys",
  "browser: Playwright UI E2E (needs frontend/dist or Vite)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "BLE001",    # eval/otel/replay catch Exception to record failures
  "S110",      # subscriber callbacks must not abort emit
  "ASYNC221",  # e2e seeds traces via a blocking demo_agent subprocess
  "SIM117",    # nested TraceSession/span with-blocks are the public API
]
