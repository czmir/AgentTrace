[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Lightweight Agent execution tracing, debugging, and eval for LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "czmir" }]
keywords = ["llm", "agent", "tracing", "observability", "eval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "sse-starlette>=2.0"]
adapters = ["langchain-core>=0.2", "openai>=1.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/czmir/AgentTrace"
Documentation = "https://github.com/czmir/AgentTrace#readme"
Repository = "https://github.com/czmir/AgentTrace"

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenttrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "BLE001",    # eval/otel/replay catch Exception to record failures
  "S110",      # subscriber callbacks must not abort emit
  "ASYNC221",  # e2e seeds traces via a blocking demo_agent subprocess
]