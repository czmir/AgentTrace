name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python
        run: |
          pip install -U pip
          pip install -e ".[dev,server,integrations]"
          pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check agenttrace tests examples
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright Chromium
        run: python -m playwright install chromium --with-deps
      - name: Pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest -q --tb=short
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Boot clean Compose stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Exercise recovery through UI proxy
        run: |
          curl --fail --retry 3 --retry-connrefused http://127.0.0.1:4321/
          curl --fail -X POST http://127.0.0.1:4321/api/demo/order-recovery -o recovery.json
          jq -e '.retry_status == "ok" and .baseline.failed == 1 and .candidate.failed == 0' recovery.json
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color
