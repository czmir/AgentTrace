name: Publish v0.3.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.3.0.yml]
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the tested release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: 32635ff914132807cb741bc2dbd289d8107ffc2b
        run: |
          if gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$actual" = "$TARGET"
          else
            gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "AgentTrace v0.3.0" --notes "Interactive LangGraph recovery, incremental SQLite recording, redacted summaries, and tree-preserving replay. See docs/recovery.md for the walkthrough and captured run."
          fi
